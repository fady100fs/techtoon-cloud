<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Techtoon Accounting Mobile App">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Techtoon">
  <meta name="theme-color" content="#37474F">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <title>Techtoon Mobile</title>
  <style>
    body { background-color: #37474F; margin: 0; padding: 0; }
    #loading-container { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      text-align: center;
      color: white;
      font-family: sans-serif;
    }
    .loader {
      border: 4px solid #f3f3f3;
      border-top: 4px solid #3498db;
      border-radius: 50%;
      width: 40px;
      height: 40px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div id="loading-container">
    <h2>Techtoon Mobile</h2>
    <div class="loader"></div>
    <p>جاري التحميل...</p>
  </div>
  
  <!-- This script installs service_worker.js to provide PWA functionality -->
  <script>
    var serviceWorkerVersion = null;
    var scriptLoaded = false;
    function loadMainDartJs() {
      if (scriptLoaded) {
        return;
      }
      scriptLoaded = true;
      var scriptTag = document.createElement('script');
      scriptTag.src = 'main.dart.js';
      scriptTag.type = 'application/javascript';
      document.body.append(scriptTag);
    }

    if ('serviceWorker' in navigator) {
      // Service workers are supported. Use them.
      window.addEventListener('load', function () {
        // Wait for registration to finish before dropping the download link.
        navigator.serviceWorker.register('flutter_service_worker.js').then(function(registration) {
          // Registration was successful
          // Check for updates
          registration.addEventListener('updatefound', function() {
            // An updated service worker has been installed
          });
        });
        loadMainDartJs();
      });
    } else {
      // Service workers not supported. Just drop the script tag.
      loadMainDartJs();
    }
  </script>
  
  <script src="flutter.js" defer></script>
  <script>
    window.addEventListener('flutter-first-frame', function() {
      var loadingContainer = document.getElementById('loading-container');
      if (loadingContainer) {
        loadingContainer.style.display = 'none';
      }
    });
  </script>
</body>
</html>
