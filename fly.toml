app = "techtoon-api"
primary_region = "lhr"

[build]
  dockerfile = "Techtoon.Api/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # H6: empty CORS config now denies every browser origin, so the deployed
  # PWA origin must be listed explicitly.
  Cors__AllowedOrigins__0 = "https://techtoon-mobile.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "10s"
  grace_period = "10s"
  method = "GET"
  path = "/health"

[[vm]]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
