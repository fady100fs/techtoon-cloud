# Fly configuration for the combined PWA + API image on the existing app.
# Deploy from an assembled context (deploy/mobile/prepare-context.ps1), e.g.:
#   flyctl deploy -c fly.toml
app = "techtoon-mobile"
primary_region = "lhr"

[build]
  dockerfile = "deploy/mobile/Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  # Same-origin PWA, but keep the explicit origin so browser CORS stays valid.
  Cors__AllowedOrigins__0 = "https://techtoon-mobile.fly.dev"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  interval = "30s"
  timeout = "15s"
  grace_period = "30s"
  method = "GET"
  path = "/health"

[vm]
  memory = "512mb"
  cpu_kind = "shared"
  cpus = 1
