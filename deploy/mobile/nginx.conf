# Nginx front door for the combined Techtoon image.
# Serves the compiled Flutter PWA and proxies the API on loopback.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 25m;

    # Never let clients cache the entry points, so a new release is picked up.
    location = /index.html {
        add_header Cache-Control "no-store" always;
        try_files $uri =404;
    }

    location = /main.dart.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /flutter_bootstrap.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /version.json {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location = /flutter_service_worker.js {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # API reverse proxy. Fly terminates TLS and sets X-Forwarded-For/Proto on the
    # public hop; forward those exact values because the API trusts one hop.
    location /api/ {
        proxy_pass http://127.0.0.1:8081;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Real-IP $http_x_forwarded_for;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    location = /health {
        proxy_pass http://127.0.0.1:8081/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # Static PWA assets (Flutter uses hash routing, so unknown paths fall back
    # to the app shell).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
